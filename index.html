<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงล้อสุ่มชื่อนำโชคฟรี</title>
    <!-- ใช้ Tailwind CSS ตกแต่งหน้าตาเว็บให้สวยงาม -->
    <script src="https://tailwindcss.com"></script>
    <style>
        #wheel {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-4xl w-full flex flex-col md:flex-row gap-8">
        <!-- ฝั่งซ้าย: วงล้อ -->
        <div class="flex-1 flex flex-col items-center justify-center">
            <div class="relative w-64 h-64 md:w-80 md:h-80">
                <!-- ลูกศรชี้รางวัล -->
                <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[30px] border-t-red-500 z-10"></div>
                <!-- ตัววงล้อ -->
                <canvas id="wheel" width="400" height="400" class="w-full h-full rounded-full border-4 border-gray-800 shadow-lg"></canvas>
            </div>
            <button id="spinBtn" class="mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg shadow-md transform active:scale-95 transition">
                🎉 หมุนวงล้อ!
            </button>
        </div>

        <!-- ฝั่งขวา: ช่องใส่คำ -->
        <div class="w-full md:w-80 flex flex-col">
            <label class="block text-gray-700 font-bold mb-2 text-lg">ใส่รายชื่อ/คำสุ่ม (1 บรรทัดต่อ 1 คำ)</label>
            <textarea id="itemsInput" class="w-full flex-1 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none h-48 md:h-full text-base" placeholder="คำที่ 1&#10;คำที่ 2&#10;คำที่ 3"></textarea>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('itemsInput');
        const spinBtn = document.getElementById('spinBtn');

        // รายชื่อเริ่มต้นในวงล้อ
        let items = ['หมูกระทะ', 'ชาบู', 'ส้มตำ', 'กะเพราไก่', 'ข้าวผัด'];
        input.value = items.join('\n');

        let currentAngle = 0;
        let isSpinning = false;

        // ฟังก์ชันวาดวงล้อ
        function drawWheel() {
            const numSegments = items.length;
            const anglePerSegment = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, i) => {
                const startAngle = i * anglePerSegment;
                const endAngle = startAngle + anglePerSegment;

                // สลับสีช่องวงล้อ
                ctx.fillStyle = i % 2 === 0 ? '#4F46E5' : '#818CF8';
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.lineTo(radius, radius);
                ctx.fill();

                // ใส่ข้อความ
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 16px Sans-serif';
                ctx.fillText(item, radius - 20, 5);
                ctx.restore();
            });
        }

        // อัปเดตวงล้อตามคำที่พิมพ์ลงไป
        input.addEventListener('input', () => {
            const lines = input.value.split('\n').filter(line => line.trim() !== '');
            if (lines.length > 0) {
                items = lines;
                drawWheel();
            }
        });

        // ฟังก์ชันสั่งหมุน
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;

            const randomRotations = 5 + Math.floor(Math.random() * 5); // หมุนรอบตัวเอง 5-10 รอบ
            const randomAngle = Math.random() * 360;
            const totalDegrees = randomRotations * 360 + randomAngle;

            currentAngle += totalDegrees;
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                alert('🎉 ยินดีด้วยคุณสุ่มได้สำเร็จ!');
            }, 4000); // รอให้แอนิเมชันหมุนจบใน 4 วินาที
        });

        drawWheel();
    </script>
</body>
</html>
